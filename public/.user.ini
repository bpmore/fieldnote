; Per-directory PHP overrides so image uploads up to the app's 10 MB cap
; actually make it through PHP. post_max_size leaves headroom for the rest of
; the form body.
;
; Read ONLY by CGI/FastCGI SAPIs — which covers the Forge/nginx deploy, where
; PHP-FPM picks this up automatically (user_ini.cache_ttl, default 300s).
; Under Apache with mod_php it does nothing at all, so the Dockerfile writes
; the same two values into conf.d/fieldnote-uploads.ini. Change one, change
; the other, or the container quietly serves PHP's 2M/8M defaults.
upload_max_filesize = 12M
post_max_size = 16M
